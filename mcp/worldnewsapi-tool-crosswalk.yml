description: >-
  Binds each World News API MCP tool to the REST operation it wraps. Both sides
  were read live: the tool list came from an unauthenticated stdio tools/list
  against world-news-api-mcp 1.0.0, and the operations from the provider's own
  OpenAPI 3 document published at
  https://raw.githubusercontent.com/ddsky/world-news-api-clients/main/world-news-api-openapi-3.json.
  The mapping is one-to-one and lossless in the REST direction: every MCP tool
  is a thin proxy over exactly one operation, and the tool inputSchema property
  names are the REST query parameter names verbatim (hyphenated, e.g.
  source-country, location-filter, headlines-only), so confidence is high on
  every row. One REST operation has no tool.
