meters:
- name: points
  description: Points (credits) consumed per API call; the primary usage meter, varying by endpoint and parameters.
  unit: points
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: subscription
  description: Fixed monthly plan fee per tier (Reporter, Journalist, Editor).
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: overage_points
  description: Points consumed beyond the included daily allowance, billed per point on paid plans.
  unit: points
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track daily point consumption via the X-API-Quota-* response headers and attribute points to endpoints and workloads.
- name: Allocation
  description: Use separate API keys or accounts per team/workload so point usage maps to internal cost centers.
- name: Optimization
  description: Cache /geo-coordinates results, request only needed fields and result counts, tighten location/date/language filters, and avoid re-extracting the same URLs to reduce point spend.
- name: Accountability
  description: Set the plan tier to the daily point allowance the workload actually needs and review overage against per-point rates monthly.
