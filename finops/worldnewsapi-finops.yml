description: >-
  FinOps view of World News API spend. Cost is driven by point (credit)
  consumption metered per API call against a daily allowance, plus a fixed
  monthly subscription per plan tier. Above the included daily allowance, paid
  plans bill per additional point at a declining per-point rate as the tier
  rises (Reporter $0.003, Journalist $0.0025, Editor $0.002). Because different
  endpoints and parameter combinations consume different point amounts, cost is
  best controlled by minimizing wasted calls - caching geo-coordinate lookups,
  requesting only the fields and result counts needed, and constraining
  location, date, and language filters.
notes: >-
  Per-endpoint point costs are not fully published and rates were captured from
  the pricing page on 2026-07-11; verify at https://worldnewsapi.com/pricing/.
