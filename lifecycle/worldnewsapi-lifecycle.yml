description: >-
  Lifecycle posture for the World News API. The provider runs an unversioned
  base URL, announces changes on a dated changelog page, publishes a public
  status page, and states per-plan uptime targets on its pricing page. It does
  not publish a standalone deprecation policy document; the deprecation
  commitments recorded here are the specific, dated notices published inside the
  changelog itself.
