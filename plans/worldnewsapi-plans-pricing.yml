description: >-
  World News API is sold as point-metered monthly subscriptions. Every endpoint
  call consumes a number of points (also called credits) that count against a
  daily point allowance; once the daily allowance is used up, calls are either
  blocked (Free) or billed per additional point (paid plans). Plans also differ
  in requests-per-second, concurrent-request limits, historical-data depth, and
  support level. A free tier is available for evaluation (with a required
  backlink to worldnewsapi.com); paid tiers remove the backlink requirement and
  add uptime guarantees and support.
notes: >-
  Re-read verbatim from https://worldnewsapi.com/pricing/ on 2026-08-13; every
  price, daily point allowance, overage rate, request-rate and concurrency
  figure below was confirmed unchanged from the 2026-07-11 capture. All four
  tiers are self-serve and published - there is no "contact us" enterprise tier,
  though the pricing FAQ says custom payment terms can be negotiated for Editor
  and for custom plans. Per-endpoint point costs vary by endpoint and parameters
  and are stated on each endpoint's documentation page rather than on the
  pricing page; treat the daily point allowance as the primary quota.
uptime_targets:
  Free: none
  Reporter: '99%'
  Journalist: '99.9%'
  Editor: '99.99%'
  note: >-
    Advertised as per-tier plan features. The FAQ on the same page separately
    claims "We guarantee 99.9% uptime for all plans", which contradicts the tier
    table; both statements are recorded rather than resolved.
history_limits:
  Free: 1 month
  paid: back to 2022-01-01
payment:
  processor: Stripe
  methods: [credit card]
  card_required_for_free_tier: false
