aid: worldnewsapi
url: https://raw.githubusercontent.com/api-evangelist/worldnewsapi/refs/heads/main/apis.yml
name: World News API
kind: company
description: >-
  World News API is a real-time and historical news data API covering thousands
  of sources across 210+ countries and 86+ languages. It provides full-text and
  semantic news search, geo-targeted local news search (a radius filter around a
  latitude/longitude point), article content and link extraction from arbitrary
  URLs, country-level top news clustering, newspaper front-page images, and
  news-source discovery. Local news search is a first-class feature - resolve a
  place name to coordinates with the Geo Coordinates endpoint, then pass those
  coordinates to Search News via the location-filter parameter to find news
  published or mentioned near that place. Requests are authenticated with an API
  key (api-key query parameter or x-api-key header) and metered in points against
  a daily plan allowance.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- News
- Local News
- News Search
- Media Monitoring
- Geo Search
- News Data
- Sentiment Analysis
- Content Extraction
created: '2026-07-11'
modified: '2026-07-11'
specificationVersion: '0.19'
apis:
- aid: worldnewsapi:worldnewsapi-search-news-api
  name: World News Search News API
  tags:
  - News Search
  - Local News
  - Geo Search
  - Semantic Search
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://worldnewsapi.com/docs/search-news/
  baseURL: https://api.worldnewsapi.com
  properties:
  - url: https://worldnewsapi.com/docs/search-news/
    type: Documentation
  - url: https://worldnewsapi.com/docs/search-news/
    type: APIReference
  - url: openapi/worldnewsapi-openapi.yml
    type: OpenAPI
  - url: collections/worldnewsapi.postman_collection.json
    type: PostmanCollection
  - url: collections/worldnewsapi.opencollection.json
    type: OpenCollection
  description: >-
    Search and filter news by keyword, semantic entities, category, language,
    source country, and publish-date range. Supports local news search via the
    location-filter parameter, which draws a 1-100 km radius around a
    latitude/longitude point (e.g. "51.509865,-0.118092,15") to find news near a
    place. Returns article title, text, summary, image, publish date, authors,
    language, source country, category, and sentiment, with offset/number
    pagination up to 100 results.
- aid: worldnewsapi:worldnewsapi-geo-coordinates-api
  name: World News Geo Coordinates API
  tags:
  - Geo Search
