aid: worldnewsapi
url: https://raw.githubusercontent.com/api-evangelist/worldnewsapi/refs/heads/main/apis.yml
name: World News API
kind: company
description: >-
  World News API is a real-time and historical news data API covering thousands
  of sources across 210+ countries and 86+ languages. It provides full-text and
  semantic news search, geo-targeted local news search (a radius filter around a
  latitude/longitude point), article content and link extraction from arbitrary
  URLs, country-level top news clustering, newspaper front-page images, and
  news-source discovery. Local news search is a first-class feature - resolve a
  place name to coordinates with the Geo Coordinates endpoint, then pass those
  coordinates to Search News via the location-filter parameter to find news
  published or mentioned near that place. Requests are authenticated with an API
  key (api-key query parameter or x-api-key header) and metered in points against
  a daily plan allowance.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
