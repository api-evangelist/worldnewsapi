  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://worldnewsapi.com/docs/get-geo-coordinates/
  baseURL: https://api.worldnewsapi.com
  properties:
  - url: https://worldnewsapi.com/docs/get-geo-coordinates/
    type: Documentation
  - url: openapi/worldnewsapi-openapi.yml
    type: OpenAPI
  - url: collections/worldnewsapi.postman_collection.json
    type: PostmanCollection
  - url: collections/worldnewsapi.opencollection.json
    type: OpenCollection
  description: >-
    Resolve a free-form location name (e.g. "Tokyo, Japan") to its latitude,
    longitude, and canonical city name. The returned coordinates feed the Search
    News location-filter parameter to power local and geo news search.
