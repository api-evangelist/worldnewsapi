format_note: >-
  World News API does not use RFC 9457 problem+json. Every one of the nine
  operations in the provider's OpenAPI declares the same six error statuses -
  401, 402, 403, 404, 406, 429 - each with a bare reason-phrase description and
  no response body schema and no content type at all. There is therefore no
  machine-readable error envelope to bind an agent to: the status code is the
  entire error contract. The remediation text below is taken from the
  provider's authentication and quota documentation, not invented.
envelope:
  documented: false
  media_type: null
  note: >-
    The OpenAPI declares no content for any 4xx response. Clients must branch on
    the HTTP status code alone.
problems:
- status: 401
  title: Unauthorized
  meaning: The API key is missing or invalid.
  remediation: >-
    Supply the key as the api-key query parameter or the x-api-key request
    header. Get or rotate a key at https://worldnewsapi.com/console/.
  agent_action: fail-do-not-retry
  source_operations: [searchNews, topNews, retrieveNewspaperFrontPage, retrieveNewsArticlesByIds,
    extractNews, extractNewsLinks, searchNewsSources, newsWebsiteToRSSFeed, getGeoCoordinates]
- status: 402
  title: Payment Required
  meaning: >-
    The daily point (credit) allowance for the plan has been consumed. On the
    Free plan no further calls succeed until the quota resets at midnight UTC;
    on paid plans overage billing applies instead.
  remediation: >-
    Read X-API-Quota-Left on the previous successful response before retrying,
    wait for the midnight-UTC reset, or upgrade the plan at
    https://worldnewsapi.com/pricing/.
  agent_action: stop-until-reset
  docs: https://worldnewsapi.com/docs/quotas-and-rate-limiting/
  source_operations: [searchNews, topNews, retrieveNewspaperFrontPage, retrieveNewsArticlesByIds,
    extractNews, extractNewsLinks, searchNewsSources, newsWebsiteToRSSFeed, getGeoCoordinates]
- status: 403
  title: Forbidden
  meaning: >-
    The key is valid but the plan does not include the requested capability.
    Front Pages and Suggest News Source are documented as paid-plan-only
    features.
  remediation: Upgrade the plan at https://worldnewsapi.com/pricing/.
  agent_action: fail-do-not-retry
  source_operations: [searchNews, topNews, retrieveNewspaperFrontPage, retrieveNewsArticlesByIds,
