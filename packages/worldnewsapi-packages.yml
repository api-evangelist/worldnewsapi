description: >-
  World News API publishes first-party client libraries generated with
  OpenAPI Generator from its own OpenAPI 3 document
  (https://raw.githubusercontent.com/ddsky/world-news-api-clients/main/world-news-api-openapi-3.json).
  Only the JavaScript and Python clients are published to a package registry
  (npm and PyPI); every other language is distributed as a source directory in
  the ddsky/world-news-api-clients GitHub repository and as a downloadable zip
  from https://worldnewsapi.com/downloads/sdks/<key>-client.zip, with no
  registry metadata endpoint and therefore no published version or date.
  The MCP server is a separate first-party npm package.
